<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | محطة الدعم</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

  <header class="hero hero--auth">
    <div class="overlay"></div>

    <div class="wrap">

      <!-- رأس الصفحة -->
      <div class="top top--auth">
        <img class="logo" src="img/logo.png" alt="الشعار">
        <div class="org"></div>
      </div>

      <!-- بطاقة التسجيل -->
      <main class="auth-card" aria-label="نموذج إنشاء حساب">
        <h1 class="auth-title">إنشاء حساب جديد</h1>
        <p class="auth-sub">
          الرجاء إدخال بريدك الإلكتروني لإنشاء حساب جديد.
        </p>
<div class="role-group" role="radiogroup" aria-label="نوع الحساب">
          <label class="role">
            <input type="radio" name="role" value="trainee" checked>
            <span>متدرب</span>
          </label>

          <label class="role" >
            <input type="radio" name="role" value="trainer">
            <span>مدرب</span>
          </label>

          <label class="role">
            <input type="radio" name="role" value="admin">
            <span>مسؤول</span>
          </label>
        </div>
        <!-- بيانات التسجيل -->
        <form id="signupForm" class="auth-form" autocomplete="on">

          <label class="field">
            <span>البريد الإلكتروني</span>
            <input type="email" id="email" placeholder="example@tvtc.edu.sa" required />
          </label>
    <div class="field-note">
      <span class="note-icon">💡يرجى استخدام البريد الإلكتروني الجامعي الخاص بك (college@tvtc.edu.sa)</span>
 
    </div>
          <label class="field">
            <span>كلمة المرور</span>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
          </label>

          <button class="btn btn--solid" type="button" onclick="signUp()">إنشاء الحساب</button>

          <div id="msg" class="msg" aria-live="polite"></div>
        </form>

        <a class="back-link" href="login.html">لديك حساب؟ تسجيل الدخول</a>
      </main>

    </div>
  </header>

  <script type="module">
    import { supabase } from "./supabase.js";

    async function signUp() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "جاري إنشاء الحساب...";

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: "https://ghadeer06.github.io/supportstation/"
        }
      });

      if (error) {
        msg.textContent = "حدث خطأ أثناء إنشاء الحساب.";
        console.error(error);
        return;
      }

      msg.textContent = "تم إرسال رابط التفعيل إلى بريدك الإلكتروني.";
    }
  </script>
<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2026 حقوق محفوظة | محطة الدعم </p>
        <ul class="footer-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="#">عن الموقع</a></li>
            <li>@example اتصل بنا</a></li>
        </ul>
    </div>
</footer>
</body>
</html>
