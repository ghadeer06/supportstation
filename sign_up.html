<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | محطة الدعم</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

  <header class="hero hero--auth">
    <div class="overlay"></div>

    <div class="wrap">

      <div class="top top--auth">
        <img class="logo" src="img/logo.png" alt="الشعار">
        <div class="org"></div>
      </div>

      <main class="auth-card">
        <h1 class="auth-title">إنشاء حساب جديد</h1>
        <p class="auth-sub">الرجاء إدخال بريدك الإلكتروني لإنشاء حساب جديد.</p>

        <form id="signupForm" class="auth-form">

          <label class="field">
            <span>البريد الإلكتروني</span>
            <input type="email" id="email" placeholder="example@tvtc.edu.sa" required />
          </label>

          <label class="field">
            <span>كلمة المرور</span>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
          </label>

          <button class="btn btn--solid" type="button" onclick="signUp()">إنشاء الحساب</button>

          <div id="msg" class="msg"></div>
        </form>

        <a class="back-link" href="login.html">لديك حساب؟ تسجيل الدخول</a>
      </main>

    </div>
  </header>

  <!-- تحميل supabase.js -->
  <script type="module" src="supabase.js"></script>

  <!-- سكربت التسجيل -->
  <script type="module">

    async function signUp() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "جاري إنشاء الحساب...";

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: "https://ghadeer06.github.io/supportstation/verify.html"
        }
      });

      if (error) {
        msg.textContent = "حدث خطأ أثناء إنشاء الحساب.";
        console.error(error);
        return;
      }

      msg.textContent = "تم إرسال رابط التفعيل إلى بريدك الإلكتروني.";
    }

    // مهم جداً
    window.signUp = signUp;

  </script>

</body>
</html>
