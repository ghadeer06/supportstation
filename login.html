
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الزر</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      direction: rtl;
      background:#0F2F4A;
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
    }
    .box{
      background:rgba(255,255,255,0.12);
      padding:30px;
      border-radius:16px;
      width:320px;
    }
    input, button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:16px;
      box-sizing:border-box;
    }
    button{
      background:white;
      color:#0F2F4A;
      cursor:pointer;
      font-weight:bold;
    }
    #msg{
      margin-top:12px;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>اختبار الزر</h2>
    <input type="email" id="email" placeholder="اكتب الإيميل">
    <button type="button" id="sendBtn">اضغط هنا</button>
    <p id="msg">إذا اشتغل الزر بيتغير هذا النص</p>
  </div>

  <script>
    const btn = document.getElementById("sendBtn");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", function () {
      alert("الزر اشتغل");
      msg.innerText = "اشتغل الزر فعلاً";
    });
  </script>

</body>
</html>
