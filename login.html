<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | محطة الدعم</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

  <header class="hero hero--auth">
    <div class="overlay"></div>

    <div class="wrap">

      <!-- رأس الصفحة (الشعار + اسم الجهة) -->
      <div class="top top--auth">
        <img class="logo" src="img/logo.png" alt="الشعار">
        <div class="org">
          
        </div>
      </div>

      <!-- بطاقة تسجيل الدخول -->
      <main class="auth-card" aria-label="نموذج تسجيل الدخول">
        <h1 class="auth-title">تسجيل الدخول</h1>
        <p class="auth-sub">
          الرجاء اختيار نوع الحساب ثم إدخال بيانات الدخول.
        </p>



        <!-- نوع المستخدم -->
        <div class="role-group" role="radiogroup" aria-label="نوع الحساب">
          <label class="role">
            <input type="radio" name="role" value="trainee" checked>
            <span>متدرب</span>
          </label>

          <label class="role" >
            <input type="radio" name="role" value="trainer">
            <span>مدرب</span>
          </label>

          <label class="role">
            <input type="radio" name="role" value="admin">
            <span>مسؤول</span>
          </label>
        </div>

        <!-- بيانات الدخول -->
        <form id="loginForm" class="auth-form" autocomplete="on">
          <label class="field">
            <span>البريد الإلكتروني</span>
            <input type="email" id="email" placeholder="example@tvtc.edu.sa" required />
          
			<!-- مربع الملاحظة الصغير -->
    <div class="field-note">
      <span class="note-icon">💡يرجى استخدام البريد الإلكتروني الجامعي الخاص بك (college@tvtc.edu.sa)</span>
 
    </div>
          </label>

          <label class="field">
            <span>كلمة المرور</span>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required />
          </label>

          <button class="btn btn--solid" type="button" onclick="login()" >تسجيل الدخول</button>

          <div id="msg" class="msg" aria-live="polite"></div>
        </form>

       
      </main>

    </div>
  </header>
<div id="msg" class="msg"></div>
 
  
  <script type="module" src="supabase.js"></script>
  <script type="module" src="login.js"></script>
  
<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2026 حقوق محفوظة | محطة الدعم </p>
        <ul class="footer-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="#">عن الموقع</a></li>
            <li>@example اتصل بنا</a></li>
        </ul>
    </div>
</footer>
</body>

</html>
