<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

<header class="hero hero--auth">
  <div class="overlay"></div>

  <div class="wrap">

    <div class="top top--auth">
      <img class="logo" src="img/logo.png" alt="">
    </div>

    <div class="auth-card">
      <h2 class="auth-title">تسجيل الدخول</h2>
      <p class="auth-sub">الرجاء إدخال البريد الإلكتروني لإرسال رمز التحقق.</p>

      <!-- اختيار الدور -->
      <div class="role-group">
        <label class="role">
          <input type="radio" name="role" value="trainee" checked>
          <span>متدرب</span>
        </label>

        <label class="role">
          <input type="radio" name="role" value="trainer">
          <span>مدرب</span>
        </label>

        <label class="role">
          <input type="radio" name="role" value="admin">
          <span>مسؤول</span>
        </label>
      </div>

      <!-- الفورم -->
      <div class="auth-form">

        <label class="field">
          <span>البريد الإلكتروني</span>
          <input type="email" id="email" placeholder="example@tvtc.edu.sa">
        </label>

        <p class="msg" id="msg">يرجى استخدام البريد الإلكتروني الجامعي</p>

        <!-- زر الإرسال -->
        <button type="button" class="btn btn--solid" onclick="sendOTP()">إرسال الرمز</button>

        <!-- صندوق OTP -->
        <div id="otpBox" style="display:none; margin-top:10px;">
          <label class="field">
            <span>رمز التحقق</span>
            <input type="text" id="otp" placeholder="أدخل الرمز">
          </label>

          <button type="button" class="btn btn--solid" onclick="verifyOTP()">تحقق</button>
        </div>

        <a class="back-link" href="index.html">العودة للصفحة الرئيسية</a>

      </div>
    </div>

  </div>
</header>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  'https://mcxdjisoyqdnyieboqpy.supabase.co',
  'حطي_هنا_الـ_anon_key'
);

/* إرسال OTP */
async function sendOTP(){
  const email = document.getElementById("email").value.trim();
  const role = document.querySelector('input[name="role"]:checked')?.value;
  const msg = document.getElementById("msg");

  if(email === ""){
    msg.innerText = "أدخل البريد الإلكتروني";
    return;
  }

  if(!email.endsWith("@tvtc.edu.sa")){
    msg.innerText = "يجب استخدام البريد الجامعي";
    return;
  }

  msg.innerText = "جاري إرسال الرمز...";

  const { error } = await supabase.auth.signInWithOtp({
    email: email,
    options: {
      shouldCreateUser: true,
      data: { role: role }
    }
  });

  if(error){
    msg.innerText = error.message;
    return;
  }

  document.getElementById("otpBox").style.display = "block";
  msg.innerText = "تم إرسال رمز التحقق إلى بريدك";
}

/* التحقق من OTP */
async function verifyOTP(){
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("otp").value.trim();
  const msg = document.getElementById("msg");

  if(token === ""){
    msg.innerText = "أدخل رمز التحقق";
    return;
  }

  msg.innerText = "جاري التحقق...";

  const { data, error } = await supabase.auth.verifyOtp({
    email: email,
    token: token,
    type: "email"
  });

  if(error){
    msg.innerText = error.message;
    return;
  }

  const role = data.user?.user_metadata?.role;

  if(role === "admin"){
    window.location.href = "admin.html";
  } else if(role === "trainer"){
    window.location.href = "teachers_main_page.html";
  } else {
    window.location.href = "student_main_page.html";
  }
}
</script>

</body>
</html>
