<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: Arial, sans-serif;
      direction: rtl;
      background:
        linear-gradient(rgba(18,44,74,0.70), rgba(18,44,74,0.70)),
        url("img/h1.png") center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
    }

    .card{
      width:min(520px, 92%);
      background:rgba(255,255,255,0.14);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:18px;
      padding:22px;
      backdrop-filter: blur(6px);
    }

    h2{
      margin:0 0 8px;
      font-size:26px;
      font-weight:900;
    }

    .sub{
      font-size:14px;
      line-height:1.8;
      margin:0 0 14px;
    }

    .role-group{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .role{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.10);
      cursor:pointer;
    }

    .field{
      margin-bottom:12px;
    }

    .field span{
      display:block;
      font-size:13px;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.10);
      color:#fff;
    }

    #email{
      direction:ltr;
      text-align:left;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.25);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    .note{
      margin-top:10px;
      font-size:13px;
      line-height:1.8;
      color:rgba(255,255,255,0.9);
    }

    .msg{
      margin-top:10px;
      font-size:13px;
    }

    .otp-box,
    .name-box{
      display:none;
      margin-top:12px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>تسجيل الدخول</h2>
  <p class="sub">أدخلي بريدك الإلكتروني وسنرسل لك رمز تحقق.</p>

  <!-- اختيار الدور -->
  <div class="role-group">
    <label class="role">
      <input type="radio" name="role" value="trainee" checked onchange="updateNote()">
      <span>متدرب</span>
    </label>

    <label class="role">
      <input type="radio" name="role" value="trainer" onchange="updateNote()">
      <span>مدرب</span>
    </label>

    <label class="role">
      <input type="radio" name="role" value="admin" onchange="updateNote()">
      <span>مسؤول</span>
    </label>
  </div>

  <!-- الإيميل -->
  <div class="field">
    <span>البريد الإلكتروني</span>
    <input type="email" id="email" placeholder="example@tvtc.edu.sa">
  </div>

  <!-- الملاحظة المتغيرة -->
  <p class="note" id="roleNote"></p>

  <button class="btn" onclick="startOtp()">إرسال الرمز</button>

  <div class="otp-box" id="otpBox">
    <input type="text" id="otp" placeholder="رمز التحقق">
    <button class="btn" onclick="verifyOtpCode()">تحقق</button>
  </div>

  <p class="msg" id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
function getClient() {
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'YOUR_KEY'
  );
}

let selectedRole = "trainee";

/* 🔥 تغيير الملاحظة */
function updateNote() {
  const role = document.querySelector('input[name="role"]:checked').value;
  const note = document.getElementById("roleNote");

  if (role === "trainee") {
    note.innerText = "يرجى ايستخدم البريد الجامعي (@tvtc.edu.sa)";
  } 
  else if (role === "trainer") {
    note.innerText = "يرجى استخدم البريد الوظيفي (@tvtc.gov.sa)";
  } 
  else {
    note.innerText = "المسؤول: يستخدم البريد المعتمد في النظام";
  }
}

/* 🔥 إرسال الرمز */
async function startOtp() {
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value.trim();
  selectedRole = document.querySelector('input[name="role"]:checked').value;

  if (!email) {
    msg.innerText = "أدخلي البريد الإلكتروني";
    return;
  }

  // التحقق حسب الدور
  if (selectedRole === "trainee" && !email.endsWith("@tvtc.edu.sa")) {
    msg.innerText = "البريد غير صحيح للمتدرب";
    return;
  }

  if (selectedRole === "trainer" && !email.endsWith("@tvtc.gov.sa")) {
    msg.innerText = "البريد غير صحيح للمدرب";
    return;
  }

  msg.innerText = "جاري إرسال الرمز...";
}

/* تحقق */
function verifyOtpCode(){
  document.getElementById("msg").innerText = "تم التحقق (تجريبي)";
}

/* تشغيل أولي */
updateNote();
</script>

</body>
</html>
