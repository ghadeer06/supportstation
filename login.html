<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: Arial, sans-serif;
      direction: rtl;
      color:#fff;

      background:
        linear-gradient(rgba(18,44,74,0.70), rgba(18,44,74,0.70)),
        url("img/h1.png") center/cover no-repeat;

      display:flex;
      flex-direction:column;
    }

    /* يخلي المحتوى بالنص */
    .page-content{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:min(520px, 92%);
      background:rgba(255,255,255,0.14);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:18px;
      padding:22px;
      backdrop-filter: blur(6px);
    }

    h2{
      margin:0 0 8px;
      font-size:26px;
      font-weight:900;
    }

    .sub{
      font-size:14px;
      line-height:1.8;
      margin:0 0 14px;
      opacity:.95;
    }

    .role-group{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .role{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.10);
      cursor:pointer;
    }

    .field{
      margin-bottom:12px;
    }

    .field span{
      display:block;
      font-size:13px;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.10);
      color:#fff;
      outline:none;
      font-size:15px;
    }

    .field input::placeholder{
      color:rgba(255,255,255,0.75);
    }

    #email{
      direction:ltr;
      text-align:left;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.25);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    .btn:hover{
      background:rgba(255,255,255,0.32);
    }

    .msg{
      margin-top:10px;
      min-height:22px;
      font-size:13px;
      line-height:1.7;
    }

    .otp-box,
    .name-box{
      display:none;
      margin-top:12px;
    }

    .back-link{
      display:inline-block;
      margin-top:14px;
      color:rgba(255,255,255,0.9);
      text-decoration:none;
      font-size:13px;
    }

    .back-link:hover{
      text-decoration:underline;
    }

    /* الفوتر */
    .main-footer{
      background:#0F2F4A;
      color:#fff;
      padding:16px 0;
      text-align:center;
    }

    .footer-content {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    .footer-links {
      list-style:none;
      padding:0;
      display:flex;
      gap:15px;
      margin:0;
    }

    .footer-links a {
      color:#ecf0f1;
      text-decoration:none;
      font-size:14px;
    }

    .footer-links a:hover {
      color:#cfd8df;
    }

  </style>
</head>

<body>

<div class="page-content">
  <div class="card">

    <h2>تسجيل الدخول</h2>
    <p class="sub">أدخلي بريدك الإلكتروني وسنرسل لك رمز تحقق على الإيميل.</p>

    <div class="role-group">
      <label class="role">
        <input type="radio" name="role" value="trainee" checked onchange="updateRoleNote()">
        <span>متدرب</span>
      </label>

      <label class="role">
        <input type="radio" name="role" value="trainer" onchange="updateRoleNote()">
        <span>مدرب</span>
      </label>

      <label class="role">
        <input type="radio" name="role" value="admin" onchange="updateRoleNote()">
        <span>مسؤول</span>
      </label>
    </div>

    <div class="field">
      <span>البريد الإلكتروني</span>
      <input type="email" id="email" placeholder="example@tvtc.edu.sa">
    </div>

    <p class="msg" id="roleNote"></p>

    <button type="button" class="btn" onclick="startOtp()">إرسال الرمز</button>

    <div class="otp-box" id="otpBox">
      <div class="field">
        <span>رمز التحقق</span>
        <input type="text" id="otp" placeholder="أدخلي الرمز">
      </div>
      <button type="button" class="btn" onclick="verifyOtpCode()">تحقق</button>
    </div>

    <div class="name-box" id="nameBox">
      <div class="field">
        <span>الاسم</span>
        <input type="text" id="name" placeholder="أدخلي اسمك">
      </div>
      <button type="button" class="btn" onclick="saveNameAndContinue()">تأكيد الاسم</button>
    </div>

    <p class="msg" id="msg"></p>

    <a class="back-link" href="index.html">العودة للصفحة الرئيسية</a>

  </div>
</div>

<footer class="main-footer">
  <div class="footer-content">
    <p>&copy; 2026 حقوق محفوظة | محطة الدعم</p>
    <ul class="footer-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="about.html">عن الموقع</a></li>
      <li><a href="https://twitter.com/support0station" target="_blank">اتصل بنا</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
