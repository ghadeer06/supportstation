<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إضافة فعالية</title>

  <link rel="stylesheet" href="./admin.css" />
  <link rel="stylesheet" href="./add_event.css" />
</head>

<body>

<header class="admin-header">
  <button id="menuToggle" class="menu-btn">☰</button>

  <div class="admin-left">
    <img src="./img/logo.png" class="admin-logo">
    <div class="admin-title">
      <h1>إضافة فعالية</h1>
    </div>
  </div>

  <a href="./index.html" class="logout">تسجيل الخروج</a>
</header>

<div id="overlay" class="overlay"></div>

<div class="dashboard-layout">

  <aside class="sidebar" id="sidebar">
    <h2>محطة الدعم</h2>
    <ul class="sidebar-menu">
      <li><a href="./admin.html">الرئيسية</a></li>
      <li><a href="./reports.html">البلاغات</a></li>
      <li><a href="./tasks.html">المهام</a></li>
      <li class="active"><a href="./events.html">الفعاليات</a></li>
    </ul>
  </aside>

  <main class="admin-main">

    <div class="event-form-box">
      <h2>إضافة فعالية</h2>

      <input id="eventTitle" placeholder="عنوان الفعالية">
      <textarea id="eventDesc" placeholder="الوصف"></textarea>
      <input type="date" id="eventDate">
      <input type="file" id="eventImage">

      <img id="previewImage" style="display:none; width:100%; margin-top:10px;">

      <button id="saveBtn">حفظ</button>

    </div>

  </main>
</div>

<footer class="main-footer">
  © 2026 محطة الدعم
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const menuBtn = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  menuBtn.onclick = () => {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
  };

  overlay.onclick = () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  };

  // صورة
  const input = document.getElementById("eventImage");
  const preview = document.getElementById("previewImage");

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  };

});
</script>

</body>
</html>
