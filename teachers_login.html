<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Support Station</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <!-- الهيدر -->
    <header>
        <img src="https://pbs.twimg.com/ext_tw_video_thumb/1765627227515863040/pu/img/WbUFK3aOsGtCZD2l.jpg" alt="شعار الجامعة">

        <div class="header-text">
            <h1>Support Station</h1>
            <p>منصه محطة الدعم لتقديم البلاغات</p>
        </div>
    </header>
    <!-- مربع التعريف -->
    <section class="info-box">
	<h1>تسجيل دخول المدرب</h1>
<br><br> <br><br>
         <section class="login-buttons">
        <div class="login-box">
    <form>
        <div class="input-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">log in</button>
    </form>
</div>
		 
    </section>
    </section>

    
   

    <!-- الفوتر -->
    <footer>
        © 2026 Support Station — جميع الحقوق محفوظة
    </footer>

</body>
</html>
