<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الصفحة الرئيسية للطالب</title>

    <link rel="stylesheet" href="adminStyles.css">

    <!-- تحميل supabase.js فقط (بدون CDN) -->
    <script type="module" src="supabase.js"></script>

</head>

<body>

    <header class="header">
        <h2>مرحبًا بك في منصة البلاغات</h2>
    </header>

    <main>
        <h3 style="margin: 20px;">بلاغاتك:</h3>

        <div id="reportCards" style="padding: 20px;">
            <!-- يتم تعبئته من JavaScript -->
        </div>
    </main>

    <!-- سكربت صفحة الطالب مدمج هنا -->
    <script type="module">
        import { supabase } from "./supabase.js";

        const container = document.getElementById("reportCards");

        async function loadReports() {
            const email = localStorage.getItem("user_email");
            console.log("📧 Email:", email);

            try {
                const { data, error } = await supabase
                    .from("reports")
                    .select("*")
                    .eq("sender_email", email)
                    .order("id", { ascending: false });

                if (error) {
                    container.innerHTML = `<p>خطأ في تحميل البلاغات</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="report-card" style="
                            background:#fff;
                            padding:20px;
                            border-radius:12px;
                            text-align:center;
                            box-shadow:0 4px 12px rgba(0,0,0,.08);
                        ">
                            لا توجد بلاغات حتى الآن
                        </div>`;
                    return;
                }

                container.innerHTML = "";

                data.forEach(r => {
                    const statusText = r.status || "غير محدد";

                    container.innerHTML += `
                        <div class="report-card" style="
                            background:#fff;
                            padding:18px;
                            border-radius:12px;
                            box-shadow:0 4px 12px rgba(0,0,0,.08);
                            margin-bottom:15px;
                        ">
                            <h3>#${r.id} - ${r.type}</h3>
                            <p><b>الوصف:</b> ${r.description}</p>
                            <p><b>الموقع:</b> ${r.location || "-"}</p>
                            <p><b>الحالة:</b> ${statusText}</p>
                            <button class="btn-process" onclick="openReport(${r.id})">عرض البلاغ</button>
                        </div>
                    `;
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p>صار خطأ غير متوقع</p>`;
            }
        }

        window.openReport = function(id) {
            localStorage.setItem("selectedReportId", id);
            window.location.href = "student_report.html";
        };

        loadReports();
    </script>

</body>
</html>
