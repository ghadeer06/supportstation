<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تفعيل الحساب</title>
</head>
<body>

  <h2>تفعيل الحساب عبر البريد الإلكتروني</h2>

  <label>أدخل بريدك الإلكتروني:</label>
  <input type="email" id="email" placeholder="example@tvtc.edu.sa">

  <button onclick="sendMagicLink()">إرسال رابط التفعيل</button>

  <p id="msg"></p>

  <script type="module">
    import { supabase } from "./supabase.js";

    async function sendMagicLink() {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "جاري الإرسال...";

      const { data, error } = await supabase.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: "https://ghadeer06.github.io/supportstation/"
        }
      });

      if (error) {
        msg.textContent = "حدث خطأ أثناء الإرسال.";
        console.error(error);
        return;
      }

      msg.textContent = "تم إرسال رابط التفعيل إلى بريدك الإلكتروني.";
    }
  </script>

</body>
</html>
