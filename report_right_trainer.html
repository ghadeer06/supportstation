<!-- المحتوى -->
<main class="admin-main" style="margin-right:250px; padding-top:40px;">

  <div class="container" style="max-width:700px; margin:auto;">
    <div class="card">

      <h2 style="margin-bottom:20px; color:#0F2F4A; font-weight:900;">إنشاء شكوى جديدة</h2>



<input type="hidden" id="type" value="حماية الحقوق">



      <div id="rightsNote" class="rights-note" style="display:none;">
        يتم تحويل البلاغ مباشرة إلى المسؤول المختص مع المحافظة على سرية المعالجة.
      </div>

  

      <br><br>

      <label>شدة البلاغ: <span id="rateValue">1</span> / 10</label>
      <input type="range" id="rate" min="1" max="10" value="1" oninput="updateRate()">

    

      <br><br>
	  <div id="locationField">
        <label id="locationLabel">الموقع</label>
        <input type="text" id="location" placeholder="مثال: مبنى A - قاعة 3">
      </div>

      <label for="reportImage">إرفاق صورة</label>
      <input type="file" id="reportImage" accept="image/*" capture="environment">
      <p id="imageName" style="font-size:13px; color:#666;"></p>

      <label>الوصف</label>
      <textarea id="desc" placeholder="اكتبي تفاصيل البلاغ"></textarea>

      <button class="primary" onclick="saveReport()">إرسال الشكوى</button>
      <button class="light" onclick="window.location.href='trainee_rights.html'">رجوع</button>

    </div>
  </div>

<!-- سكربت Supabase -->
<script>
function getClient() {
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
  );
}

/* لأن نوع البلاغ ثابت = حماية الحقوق */
function toggleFields(){
  const note = document.getElementById("rightsNote");
  const label = document.getElementById("locationLabel");
  const locationInput = document.getElementById("location");

  note.style.display = "block";
  label.innerText = "الجهة المرتبطة بالبلاغ";
  locationInput.placeholder = "مثال: القسم أو الجهة أو الموقع المرتبط بالشكوى";
}

function updateRate(){
  document.getElementById("rateValue").innerText =
    document.getElementById("rate").value;
}

/* رفع الصورة */
async function uploadReportImage(file) {
  if (!file) return null;

  const supabase = getClient();

  const fileExt = file.name.split('.').pop();
  const fileName = `${Date.now()}.${fileExt}`;
  const filePath = `reports/${fileName}`;

  const { error: uploadError } = await supabase.storage
    .from("report-images")
    .upload(filePath, file);

  if (uploadError) {
    alert("خطأ في رفع الصورة: " + uploadError.message);
    return null;
  }

  const { data } = supabase.storage
    .from("report-images")
    .getPublicUrl(filePath);

  return data.publicUrl;
}

async function saveReport(){
  const type = "حماية الحقوق"; // ثابت
  const location = document.getElementById("location").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const rate = document.getElementById("rate").value;

  const senderName = localStorage.getItem("userName");
  const senderEmail = localStorage.getItem("user_email");
  const senderRole = localStorage.getItem("user_role");

  if (!senderEmail) {
    alert("لازم تسجل دخول أول");
    return;
  }

  if(location === ""){
    alert("الرجاء تعبئة الجهة المرتبطة بالشكوى");
    return;
  }

  if(desc === ""){
    alert("الرجاء كتابة وصف الشكوى");
    return;
  }

  try {
    const supabase = getClient();

    const imageFile = document.getElementById("reportImage").files[0];
    let imageUrl = null;

    if (imageFile) {
      imageUrl = await uploadReportImage(imageFile);
      if (!imageUrl) return;
    }

    const { error } = await supabase
      .from("reports")
      .insert([
        {
          type: type,
          description: desc,
          location: location,
          rate: parseInt(rate),
          status: "قيد المراجعة",
          sender_name: senderName || "-",
          sender_email: senderEmail,
          sender_role: senderRole || "trainer",
          image_url: imageUrl
        }
      ]);

    if (error) {
      alert("خطأ: " + error.message);
      return;
    }

    alert("تم إرسال الشكوى بنجاح");
    window.location.href = "trainer_rights.html";

  } catch (e) {
    alert("صار خطأ: " + e.message);
  }
}

/* إظهار اسم الصورة */
const reportImageInput = document.getElementById("reportImage");
const imageName = document.getElementById("imageName");

if (reportImageInput) {
  reportImageInput.addEventListener("change", () => {
    const file = reportImageInput.files[0];
    imageName.textContent = file ? `تم اختيار الصورة: ${file.name}` : "";
  });
}

/* تشغيل الإعدادات الخاصة بحماية الحقوق */
toggleFields();
updateRate();
</script>
