<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل البلاغ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">تفاصيل البلاغ</div>

<div class="container">
  <div class="card">

    <div id="details"></div>

    <label>تحديث الحالة</label>
    <select id="status">
      <option>قيد المراجعة</option>
      <option>تحت التنفيذ</option>
      <option>تم الحل</option>
    </select>

    <button class="primary" onclick="save()">حفظ</button>
    <button class="light" onclick="deleteReport()" style="background:#ffdddd; color:#b30000;">حذف البلاغ</button>
    <button class="light" onclick="window.location.href='dashboard.html'">رجوع</button>

  </div>
</div>

<script>
  // قراءة البلاغ المختار
  let report = JSON.parse(localStorage.getItem("selectedReport"));

  // عرض التفاصيل
  const box = document.getElementById("details");
  box.innerHTML = `
    <p><strong>رقم البلاغ:</strong> #${report.id}</p>
    <p><strong>النوع:</strong> ${report.type}</p>
    <p><strong>الموقع:</strong> ${report.type === "نقل" ? "-" : report.location}</p>
    <p><strong>من:</strong> ${report.from || "-"}</p>
    <p><strong>إلى:</strong> ${report.to || "-"}</p>
    <p><strong>الوصف:</strong> ${report.desc}</p>
    <p><strong>الشدة:</strong> ${report.rate} / 10</p>
  `;

  // ضبط القائمة على الحالة الحالية
  document.getElementById("status").value = report.status;

  // حفظ التحديث
  function save(){
    let reports = JSON.parse(localStorage.getItem("reports")) || [];

    const index = reports.findIndex(r => r.id === report.id);
    reports[index].status = document.getElementById("status").value;

    localStorage.setItem("reports", JSON.stringify(reports));

    alert("تم تحديث الحالة بنجاح ✔");
    window.location.href = "dashboard.html";
  }

  // حذف البلاغ
  function deleteReport(){
    if(!confirm("هل أنتِ متأكدة من حذف البلاغ؟")) return;

    let reports = JSON.parse(localStorage.getItem("reports")) || [];

    // حذف البلاغ من القائمة
    reports = reports.filter(r => r.id !== report.id);

    // حفظ القائمة الجديدة
    localStorage.setItem("reports", JSON.stringify(reports));

    alert("تم حذف البلاغ بنجاح ❌");
    window.location.href = "dashboard.html";
  }
</script>

</body>
<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2026 حقوق محفوظة | محطة الدعم </p>

            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="#">عن الموقع</a></li>
            <li>@example اتصل بنا</a></li>
        </ul>
    </div>
</footer>
</html>
