<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة تحكم المسؤول - البلاغات</title>

  <link rel="stylesheet" href="reports.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== القائمة (مهم) ===== */
    .sidebar {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100%;
      background: #fff;
      transition: 0.3s;
      z-index: 1000;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar.open {
      right: 0;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 900;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .menu-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1100;
      font-size: 24px;
      background: #0F2F4A;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body class="admin-body">

  <!-- زر القائمة -->
  <button id="menuToggle" class="menu-btn">☰</button>

  <!-- الخلفية -->
  <div id="overlay" class="overlay"></div>

<header class="admin-header">
  <div class="admin-left">
    <img src="img/logo.png" class="admin-logo">
    <div class="admin-title">
      <h1>لوحة تحكم المسؤول</h1>
      <span>محطة الدعم</span>
    </div>
  </div>

  <a href="index.html" class="logout">تسجيل الخروج</a>
</header>

<div class="dashboard-layout">

  <!-- ✅ تم إضافة id -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h2>محطة الدعم</h2>
    </div>

    <ul class="sidebar-menu">
      <li><a href="admin.html">الصفحة الرئيسية</a></li>
      <li class="active"><a href="reports.html">البلاغات</a></li>
      <li><a href="tasks.html">مهام السلامة</a></li>
      <li><a href="events.html">الفعاليات والأيام العالمية</a></li>
    </ul>
  </aside>

  <main class="admin-main">

    <div class="admin-cards">
      <button class="stat-card stat-click active" data-filter="all" onclick="setFilter('all')">
        <h3>إجمالي البلاغات</h3>
        <p id="countAll">0</p>
      </button>

      <button class="stat-card stat-click" data-filter="review" onclick="setFilter('review')">
        <h3>قيد المراجعة</h3>
        <p id="countReview">0</p>
      </button>

      <button class="stat-card stat-click" data-filter="done" onclick="setFilter('done')">
        <h3>تم التنفيذ</h3>
        <p id="countDone">0</p>
      </button>
    </div>

    <button onclick="exportExcel()" class="btn-process" style="margin-bottom:15px;">
      تصدير البلاغات إلى Excel
    </button>

    <section class="reports-section">
      <h2 class="section-title">بلاغات المدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="trainerList"></div>
      </div>
    </section>

    <section class="reports-section">
      <h2 class="section-title">بلاغات المتدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="traineeList"></div>
      </div>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const menuBtn = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }

  menuBtn.addEventListener("click", function () {
    if (sidebar.classList.contains("open")) {
      closeSidebar();
    } else {
      openSidebar();
    }
  });

  overlay.addEventListener("click", closeSidebar);

  window.addEventListener("resize", function () {
    if (window.innerWidth > 992) {
      closeSidebar();
    }
  });

});
</script>

</body>
</html>
