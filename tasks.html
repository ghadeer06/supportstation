<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>المهام</title>
<link rel="stylesheet" href="tasks.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<header class="admin-header">
  <div class="admin-left">
    <img src="logo.png" class="admin-logo">
    <div class="admin-title">
      <h1>محطة الدعم</h1>
      <span>إدارة المهام</span>
    </div>
  </div>
</header>

<aside class="sidebar">
  <div class="sidebar-brand">
    <h2>لوحة التحكم</h2>
  </div>

  <ul class="sidebar-menu">
    <li><a href="#">الرئيسية</a></li>
    <li class="active"><a href="#">المهام</a></li>
  </ul>
</aside>

<main class="admin-main">

<h2 class="section-title">قائمة المهام</h2>

<div class="reports-box">
<table class="tasks-table">
<thead>
<tr>
<th>المهمة</th>
<th>النوع</th>
<th>الموعد</th>
<th>الحالة</th>
<th>الإجراء</th>
</tr>
</thead>

<tbody id="tasksBody"></tbody>

</table>
</div>

</main>

<script>
const supabase = window.supabase.createClient(
     "https://mcxdjisoyqdnyieboqpy.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE"
);

function daysBetween(date){
  const d = new Date(date);
  const now = new Date();
  d.setHours(0,0,0,0);
  now.setHours(0,0,0,0);
  return Math.floor((d - now)/(1000*60*60*24));
}

function getDueText(task){
  const diff = daysBetween(task.due_date);

  if(diff < 0) return "متأخرة";
  if(diff === 0) return "اليوم";
  if(diff === 1) return "غدًا";
  if(diff <=7) return `بعد ${diff} أيام`;
  if(diff <=30) return `بعد ${Math.ceil(diff/7)} أسبوع`;
  if(diff <=365) return `بعد ${Math.ceil(diff/30)} شهر`;
  return `بعد سنة`;
}

async function loadTasks(){
  const {data} = await supabase.from("tasks").select("*").order("id");

  const tbody = document.getElementById("tasksBody");
  tbody.innerHTML = "";

  data.forEach(task=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${task.title}</td>
      <td>${task.type}</td>
      <td>${task.due_date}</td>

      <td>
        <span class="status-tag">
          ${task.status === "تم التنفيذ" ? "تم التنفيذ" : getDueText(task)}
        </span>
      </td>

      <td>
        ${
          task.status === "تم التنفيذ"
          ? `<span class="done-text">تم التنفيذ</span>`
          : `<button onclick="completeTask(${task.id}, '${task.type}', '${task.due_date}')" class="btn-done">تم التنفيذ</button>`
        }
      </td>
    `;

    tbody.appendChild(tr);
  });
}

function nextDate(date,type){
  const d = new Date(date);

  if(type === "يومي") d.setDate(d.getDate()+1);
  if(type === "أسبوعي") d.setDate(d.getDate()+7);
  if(type === "شهري") d.setMonth(d.getMonth()+1);
  if(type === "سنوي") d.setFullYear(d.getFullYear()+1);

  return d.toISOString().split("T")[0];
}

async function completeTask(id,type,date){

  await supabase
  .from("tasks")
  .update({status:"تم التنفيذ"})
  .eq("id", id);

  // إنشاء نسخة جديدة
  const newDate = nextDate(date,type);

  if(type !== ""){
    await supabase.from("tasks").insert({
      title:"نسخة جديدة",
      type:type,
      due_date:newDate,
      status:"قيد التنفيذ"
    });
  }

  loadTasks();
}

loadTasks();
</script>

</body>
</html>
