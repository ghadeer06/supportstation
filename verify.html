<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جاري التحقق...</title>
</head>
<body>

  <h2>جاري التحقق من حسابك...</h2>
  <p id="msg"></p>

  <script type="module">
    import { supabase } from "./supabase.js";

    async function checkSession() {
      const msg = document.getElementById("msg");

      const { data, error } = await supabase.auth.getSession();

      if (data.session) {
        msg.textContent = "تم التفعيل بنجاح! جاري تحويلك...";
        setTimeout(() => {
          window.location.href = "student_main_page.html";
        }, 1500);
      } else {
        msg.textContent = "لم يتم التحقق. يرجى المحاولة مرة أخرى.";
      }
    }

    checkSession();
  </script>

</body>
</html>
