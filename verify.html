<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جاري التحقق...</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

  <header class="hero hero--auth">
    <div class="overlay"></div>
    <div class="wrap">
      <main class="auth-card">
        <h1 class="auth-title">جاري التحقق من حسابك...</h1>
        <p id="msg" class="auth-sub"></p>
      </main>
    </div>
  </header>

  <script type="module">
    import { supabase } from "./supabase.js";

    async function checkSession() {
      const msg = document.getElementById("msg");

      const { data } = await supabase.auth.getSession();

      if (data.session) {
        msg.textContent = "تم تفعيل حسابك بنجاح! سيتم تحويلك الآن...";
        setTimeout(() => {
          window.location.href = "student_main_page.html";
        }, 1500);
      } else {
        msg.textContent = "لم يتم التحقق من الحساب. يرجى المحاولة مرة أخرى.";
      }
    }

    checkSession();
  </script>

</body>
</html>
