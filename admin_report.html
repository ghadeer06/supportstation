<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض البلاغ</title>
  <link rel="stylesheet" href="style_report.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="report-page">
    <div class="report-card">

      <div class="report-info">
        <h2 id="r_id">بلاغ #</h2>

        <p><strong>نوع البلاغ:</strong> <span id="r_type">-</span></p>
        <p><strong>الوصف:</strong> <span id="r_desc">-</span></p>
        <p><strong>الموقع:</strong> <span id="r_location">-</span></p>
        <p><strong>من:</strong> <span id="r_from">-</span></p>
        <p><strong>إلى:</strong> <span id="r_to">-</span></p>
        <p><strong>شدة البلاغ:</strong> <span id="r_rate">-</span></p>

        <div class="status-block">
          <label for="statusValue"><strong>الحالة الحالية:</strong></label>

          <div class="select-wrap">
            <select id="statusValue">
              <option value="قيد المراجعة">قيد المراجعة</option>
              <option value="تم التنفيذ">تم التنفيذ</option>
            </select>
          </div>
        </div>

        <button class="save-btn" onclick="saveStatus()">حفظ الحالة</button>

        <div class="bottom-actions">
          <button class="delete-btn" onclick="deleteReport()">حذف البلاغ</button>
          <button class="back-btn" onclick="goBack()">رجوع</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    function getClient() {
      return window.supabase.createClient(
        'https://mcxdjisoyqdnyieboqpy.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
      );
    }

    let selectedId = localStorage.getItem("adminSelectedReport");

    function normalizeStatus(status) {
      if (status === "تم الحل") return "تم التنفيذ";
      if (status === "قيد المعالجة") return "قيد المراجعة";
      return status || "قيد المراجعة";
    }

    async function loadReport() {
      if (!selectedId) {
        alert("لم يتم تحديد البلاغ");
        window.location.href = "admin.html";
        return;
      }

      const supabase = getClient();

      const { data, error } = await supabase
        .from("reports")
        .select("*")
        .eq("id", selectedId)
        .single();

      if (error || !data) {
        alert("تعذر تحميل البلاغ");
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("r_id").innerText = "بلاغ #" + data.id;
      document.getElementById("r_type").innerText = data.type || "-";
      document.getElementById("r_desc").innerText = data.description || "-";
      document.getElementById("r_location").innerText = data.location || "-";
      document.getElementById("r_from").innerText = data.from_location || "-";
      document.getElementById("r_to").innerText = data.to_location || "-";
      document.getElementById("r_rate").innerText = data.rate || "-";

      document.getElementById("statusValue").value = normalizeStatus(data.status);
    }

    async function saveStatus() {
      const newStatus = document.getElementById("statusValue").value;
      const supabase = getClient();

      const { error } = await supabase
        .from("reports")
        .update({ status: newStatus })
        .eq("id", selectedId);

      if (error) {
        alert("حدث خطأ أثناء حفظ الحالة");
        return;
      }

      alert("تم حفظ الحالة");
      window.location.href = "admin.html";
    }

    async function deleteReport() {
      if (!confirm("هل أنت متأكدة من حذف البلاغ؟")) return;

      const supabase = getClient();

      const { error } = await supabase
        .from("reports")
        .delete()
        .eq("id", selectedId);

      if (error) {
        alert("حدث خطأ أثناء حذف البلاغ");
        return;
      }

      alert("تم حذف البلاغ");
      window.location.href = "admin.html";
    }

    function goBack() {
      window.location.href = "admin.html";
    }

    loadReport();
  </script>

</body>
</html>
