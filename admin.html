<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المسؤول</title>
  <link rel="stylesheet" href="adminStyles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <a href="login.html" class="logout">تسجيل الخروج</a>

    <div class="admin-left">
      <div class="admin-title">
        <h1>لوحة تحكم المسؤول</h1>
        <span>متابعة البلاغات</span>
      </div>
      <img src="img/logo.png" class="admin-logo" alt="الشعار">
    </div>
  </header>

  <main class="admin-main">

    <!-- الإحصائيات -->
    <section class="admin-cards">
      <div class="stat-card">
        <h3>تم الحل</h3>
        <p id="doneCount">0</p>
      </div>

      <div class="stat-card">
        <h3>قيد المعالجة</h3>
        <p id="processingCount">0</p>
      </div>

      <div class="stat-card">
        <h3>إجمالي البلاغات</h3>
        <p id="totalCount">0</p>
      </div>
    </section>

    <!-- الفلاتر -->
    <section class="reports-section">
      <div class="admin-filters" id="adminFilters">
        <button type="button" class="filter-btn active" id="filterAll">كل البلاغات</button>
        <button type="button" class="filter-btn" id="filterNew">جديدة</button>
        <button type="button" class="filter-btn" id="filterProcessing">قيد المعالجة</button>
        <button type="button" class="filter-btn" id="filterDone">تم التنفيذ</button>
      </div>
    </section>

    <!-- بلاغات المدربين -->
    <section class="reports-section">
      <h2 class="section-title">بلاغات المدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="trainerReports"></div>
      </div>
    </section>

    <!-- بلاغات المتدربين -->
    <section class="reports-section">
      <h2 class="section-title">بلاغات المتدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="traineeReports"></div>
      </div>
    </section>

  </main>

<script>
function getClient() {
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
  );
}

let currentFilter = "all";

function mapStatusToFilter(status) {
  if (status === "قيد المعالجة") return "processing";
  if (status === "تم التنفيذ") return "done";
  return "new";
}

function setFilter(filter, clickedBtn) {
  currentFilter = filter;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  clickedBtn.classList.add("active");
  loadReports();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("filterAll").addEventListener("click", function () {
    setFilter("all", this);
  });

  document.getElementById("filterNew").addEventListener("click", function () {
    setFilter("new", this);
  });

  document.getElementById("filterProcessing").addEventListener("click", function () {
    setFilter("processing", this);
  });

  document.getElementById("filterDone").addEventListener("click", function () {
    setFilter("done", this);
  });

  loadReports();
});

async function updateStatus(id, newStatus) {
  const supabase = getClient();

  const { error } = await supabase
    .from("reports")
    .update({ status: newStatus })
    .eq("id", id);

  if (error) {
    alert("خطأ في تحديث الحالة");
    return;
  }

  loadReports();
}

function openReport(id) {
  localStorage.setItem("adminSelectedReport", id);
  window.location.href = "admin_report.html";
}

function makeReportRow(r) {
  const statusText = r.status || "قيد المراجعة";
  const statusFilter = mapStatusToFilter(statusText);

  if (currentFilter !== "all" && currentFilter !== statusFilter) {
    return "";
  }

  return `
    <div class="simple-report-row">
      <div class="simple-report-main">
        <span class="simple-id">#${r.id}</span>
        <span class="simple-type">${r.type || "-"}</span>
        <span class="simple-desc"><strong>الوصف:</strong> ${r.description || "-"}</span>
        <span class="simple-location"><strong>الموقع:</strong> ${r.location || "-"}</span>
        <span class="simple-status"><strong>الحالة:</strong> ${statusText}</span>
      </div>

      <div class="simple-report-actions">
        <button type="button" class="mini-btn secondary" onclick="openReport(${r.id})">عرض بلاغ</button>
        <button type="button" class="mini-btn process" onclick="updateStatus(${r.id}, 'قيد المعالجة')">قيد المعالجة</button>
        <button type="button" class="mini-btn done" onclick="updateStatus(${r.id}, 'تم التنفيذ')">تم التنفيذ</button>
      </div>
    </div>
  `;
}

async function loadReports() {
  const supabase = getClient();

  const { data, error } = await supabase
    .from("reports")
    .select("*")
    .order("id", { ascending: false });

  const trainerBox = document.getElementById("trainerReports");
  const traineeBox = document.getElementById("traineeReports");

  if (error) {
    trainerBox.innerHTML = "حدث خطأ في تحميل البلاغات";
    traineeBox.innerHTML = "حدث خطأ في تحميل البلاغات";
    return;
  }

  const reports = data || [];

  const trainerData = reports.filter(r => r.sender_role === "trainer");
  const traineeData = reports.filter(r => r.sender_role === "trainee");

  const totalCount = reports.length;
  const processingCount = reports.filter(r => r.status === "قيد المعالجة").length;
  const doneCount = reports.filter(r => r.status === "تم التنفيذ").length;

  document.getElementById("totalCount").innerText = totalCount;
  document.getElementById("processingCount").innerText = processingCount;
  document.getElementById("doneCount").innerText = doneCount;

  const trainerHtml = trainerData.map(makeReportRow).join("");
  const traineeHtml = traineeData.map(makeReportRow).join("");

  trainerBox.innerHTML = trainerHtml || `<div class="empty-row">لا توجد بلاغات</div>`;
  traineeBox.innerHTML = traineeHtml || `<div class="empty-row">لا توجد بلاغات</div>`;
}
</script>

</body>
</html>
