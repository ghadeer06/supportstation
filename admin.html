<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة المسؤول</title>

  <link rel="stylesheet" href="adminStyles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== تبويبات ===== */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 18px;
      border: none;
      background: #eee;
      cursor: pointer;
      border-radius: 6px;
      font-size: 15px;
      transition: 0.2s;
    }

    .tab:hover {
      background: #ddd;
    }

    .tab.active {
      background: #4a90e2;
      color: white;
    }
  </style>
</head>

<body class="admin-body">

<!-- ===== Header ===== -->
<header class="admin-header">
  <div class="admin-left">
    <div class="admin-title">
      <h1>لوحة المسؤول</h1>
      <span>إدارة البلاغات</span>
    </div>
    <img src="img/logo.png" class="admin-logo">
  </div>

  <a href="login.html" class="logout">تسجيل الخروج</a>
</header>

<!-- ===== Main ===== -->
<main class="admin-main">

  <section class="reports-section">
    <h2 class="section-title">جميع البلاغات</h2>

    <!-- ===== التبويبات ===== -->
    <div class="tabs">
      <button class="tab active" onclick="filterReports('all', event)">الكل</button>
      <button class="tab" onclick="filterReports('جديدة', event)">جديدة</button>
      <button class="tab" onclick="filterReports('قيد المعالجة', event)">قيد المعالجة</button>
      <button class="tab" onclick="filterReports('تم التنفيذ', event)">تم التنفيذ</button>
    </div>

    <div class="reports-box">
      <div class="reports-scroll" id="reportsList"></div>
    </div>
  </section>

</main>

<!-- ===== Script ===== -->
<script>
function getClient(){
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
  );
}

// حماية الصفحة (فقط مسؤول)
const role = localStorage.getItem("user_role");
if(role !== "admin"){
  window.location.href = "login.html";
}

// ===== التصفية =====
let currentFilter = "all";

function filterReports(status, event){
  currentFilter = status;

  // تغيير مظهر التبويبات
  document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");

  loadReports();
}

// ===== تحميل البلاغات =====
loadReports();

async function loadReports(){
  const container = document.getElementById("reportsList");
  container.innerHTML = "جاري التحميل...";

  const supabase = getClient();

  const { data, error } = await supabase
    .from("reports")
    .select("*")
    .order("id", { ascending: false });

  if(error){
    container.innerHTML = "خطأ في تحميل البيانات";
    return;
  }

  if(!data || data.length === 0){
    container.innerHTML = "لا يوجد بلاغات";
    return;
  }

  container.innerHTML = "";

  // تطبيق التصفية
  const filtered = data.filter(r => currentFilter === "all" || r.status === currentFilter);

  if(filtered.length === 0){
    container.innerHTML = "لا يوجد بلاغات في هذا التبويب";
    return;
  }

  filtered.forEach(r => {

    container.innerHTML += `
      <div class="report-card">

        <!-- يمين -->
        <div class="right-tags">
          <span class="tag id">#${r.id}</span>
          <span class="tag type">${r.type || "-"}</span>
        </div>

        <!-- المحتوى -->
        <div class="report-body">

          <div class="report-meta">
            <strong>الموقع:</strong> ${r.location || "-"}
            <span class="dot">•</span>
            <strong>الحالة:</strong> ${r.status || "-"}
          </div>

          <div class="badges">
            <span class="badge sev">شدة البلاغ: ${r.severity || "-"}</span>
            <span class="badge priority">الدور: ${r.sender_role || "-"}</span>
          </div>

          <div class="report-text">
            <strong>الوصف:</strong> ${r.description || "-"}<br>
            <strong>مقدم البلاغ:</strong> ${r.sender_name || "-"}<br>
            <strong>الإيميل:</strong> ${r.sender_email || "-"}
          </div>

          <div class="actions">
            <button class="btn-process"
              onclick="updateStatus(${r.id}, 'قيد المعالجة')">
              قيد المعالجة
            </button>

            <button class="btn-done"
              onclick="updateStatus(${r.id}, 'تم التنفيذ')">
              تم التنفيذ
            </button>
          </div>

        </div>

      </div>
    `;
  });
}

// ===== تحديث الحالة =====
async function updateStatus(id, status){
  const supabase = getClient();

  const { error } = await supabase
    .from("reports")
    .update({ status: status })
    .eq("id", id);

  if(error){
    alert("خطأ في التحديث");
    return;
  }

  loadReports();
}
</script>

</body>
</html>
