<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الصفحة الرئيسية - محطة الدعم</title>

  <link rel="stylesheet" href="admin.css?v=2"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-body">

<header class="admin-header">
  <button id="menuToggle" class="menu-btn">☰</button>

  <div class="admin-left">
    <img src="img/logo.png" class="admin-logo">
    <div class="admin-title">
      <h1>الصفحة الرئيسية</h1>
      <span>نظرة عامة على النظام</span>
    </div>
  </div>

  <a href="index.html" class="logout">تسجيل الخروج</a>
</header>

<div id="overlay" class="overlay"></div>

<div class="dashboard-layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h2>محطة الدعم</h2>
    </div>

    <ul class="sidebar-menu">
      <li class="active"><a href="#">الصفحة الرئيسية</a></li>
      <li><a href="reports.html">البلاغات</a></li>
      <li><a href="tasks.html">مهام السلامة</a></li>
      <li><a href="events.html">الفعاليات</a></li>
    </ul>
  </aside>

  <main class="admin-main">

    <section class="reports-section">
      <h2 class="section-title">أحدث الإشعارات</h2>
      <div class="reports-box" id="latestNotifications"></div>
    </section>

    <section class="reports-section">
      <h2 class="section-title">أحدث المهام</h2>
      <div class="reports-box" id="latestTasks"></div>
    </section>

  </main>
</div>

<footer class="main-footer">
  <div class="footer-content">
    <p>&copy; 2026 محطة الدعم</p>
  </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  // ===== SIDEBAR =====
  const menuBtn = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  function closeSidebar(){
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  }

  function openSidebar(){
    sidebar.classList.add("open");
    overlay.classList.add("show");
  }

  menuBtn.addEventListener("click", () => {
    if (window.innerWidth <= 992) {
      sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
    }
  });

  overlay.addEventListener("click", closeSidebar);

  window.addEventListener("resize", () => {
    if (window.innerWidth > 992) closeSidebar();
  });

  // ===== SUPABASE =====
  const supabase = window.supabase.createClient(
    "https://mcxdjisoyqdnyieboqpy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE"
  );

  const notifBox = document.getElementById("latestNotifications");
  const taskBox = document.getElementById("latestTasks");

  notifBox.innerHTML = "<div class='loading-box'>جارٍ التحميل...</div>";
  taskBox.innerHTML = "<div class='loading-box'>جارٍ التحميل...</div>";

  async function loadEvents(){
    const { data } = await supabase.from("events").select("*").limit(5);
    notifBox.innerHTML = "";

    data?.forEach(e=>{
      notifBox.innerHTML += `
        <div class="report-card">
          <img src="${e.image_url || 'img/default.jpg'}" class="event-img">
          <div>
            <h3>${e.title}</h3>
            <p>${e.description || ""}</p>
          </div>
        </div>`;
    });
  }

  async function loadTasks(){
    const { data } = await supabase.from("tasks").select("*").limit(5);
    taskBox.innerHTML = "";

    data?.forEach(t=>{
      taskBox.innerHTML += `
        <div class="report-card">
          <div>
            <h3>${t.title}</h3>
            <p>${t.type}</p>
            <span>${t.status}</span>
          </div>
        </div>`;
    });
  }

  loadEvents();
  loadTasks();

});
</script>

</body>
</html>
