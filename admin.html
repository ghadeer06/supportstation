<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المسؤول</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .reports-wrapper{
      width:90%;
      max-width:1100px;
      margin:40px auto;
    }

    .report-card{
      background:#fff;
      border-radius:14px;
      padding:20px;
      margin-bottom:15px;
      box-shadow:0 8px 20px rgba(0,0,0,.08);
      border-right:4px solid #5E7B93;
    }

    .report-card h3{
      margin-bottom:10px;
      color:#0F2F4A;
    }

    .report-card p{
      margin:6px 0;
      color:#333;
      line-height:1.8;
    }

    .status-box{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .status-btn{
      padding:8px 12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#5E7B93;
      color:#fff;
    }
  </style>
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-left">
      <img src="img/logo.png" class="admin-logo" alt="">
      <h1>لوحة المسؤول</h1>
    </div>
    <a href="login.html" class="logout">تسجيل الخروج</a>
  </header>

  <main class="reports-wrapper">
    <h2 class="admin-section-title">جميع البلاغات</h2>
    <div id="reportsList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function getClient() {
      return window.supabase.createClient(
        'https://mcxdjisoyqdnyieboqpy.supabase.co',
        'حطي_هنا_الـ_anon_key_الحقيقي'
      );
    }

    async function updateStatus(id, newStatus) {
      const supabase = getClient();

      const { error } = await supabase
        .from("reports")
        .update({ status: newStatus })
        .eq("id", id);

      if (error) {
        alert("خطأ في تحديث الحالة: " + error.message);
        return;
      }

      loadReports();
    }

    async function loadReports() {
      const supabase = getClient();

      const { data, error } = await supabase
        .from("reports")
        .select("*")
        .order("id", { ascending: false });

      const container = document.getElementById("reportsList");
      container.innerHTML = "";

      if (error) {
        container.innerHTML = "<p>صار خطأ في جلب البلاغات</p>";
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = "<p>لا توجد بلاغات حالياً</p>";
        return;
      }

      data.forEach(r => {
        container.innerHTML += `
          <div class="report-card">
            <h3>بلاغ #${r.id}</h3>
            <p><b>نوع البلاغ:</b> ${r.type || "-"}</p>
            <p><b>الوصف:</b> ${r.description || "-"}</p>
            <p><b>الموقع:</b> ${r.location || "-"}</p>
            <p><b>شدة البلاغ:</b> ${r.rate || "-"}</p>
            <p><b>الحالة:</b> ${r.status || "-"}</p>
            <p><b>مقدم البلاغ:</b> ${r.sender_name || "-"}</p>
            <p><b>الإيميل:</b> ${r.sender_email || "-"}</p>
            <p><b>الدور:</b> ${r.sender_role || "-"}</p>

            <div class="status-box">
              <button class="status-btn" onclick="updateStatus(${r.id}, 'قيد المراجعة')">قيد المراجعة</button>
              <button class="status-btn" onclick="updateStatus(${r.id}, 'قيد المعالجة')">قيد المعالجة</button>
              <button class="status-btn" onclick="updateStatus(${r.id}, 'تم الحل')">تم الحل</button>
            </div>
          </div>
        `;
      });
    }

    loadReports();
  </script>
</body>
</html>
