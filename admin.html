<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة المسؤول</title>
  <link rel="stylesheet" href="adminStyles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="admin-header">
  <div class="admin-right">
    <img src="img/logo.png" class="admin-logo">
    <div class="admin-title">
      <h1>لوحة تحكم المسؤول</h1>
      <span>متابعة البلاغات</span>
    </div>
  </div>

  <a href="login.html" class="logout">تسجيل الخروج</a>
</header>

<!-- ===== MAIN ===== -->
<main class="admin-main">

  <!-- ===== CARDS ===== -->
  <section class="admin-cards">

    <div class="stat-card stat-filter" onclick="setFilter('done')">
      <h3>تم التنفيذ</h3>
      <p id="doneCount">0</p>
    </div>

    <div class="stat-card stat-filter" onclick="setFilter('review')">
      <h3>قيد المراجعة</h3>
      <p id="reviewCount">0</p>
    </div>

    <div class="stat-card stat-filter" onclick="setFilter('all')">
      <h3>إجمالي البلاغات</h3>
      <p id="totalCount">0</p>
    </div>

  </section>

  <!-- ===== REPORTS ===== -->
  <section class="reports-section">
    <h2 class="section-title">بلاغات المتدربين</h2>

    <div class="reports-box">
      <div id="reportsList"></div>
    </div>
  </section>

</main>

<footer class="main-footer">
  © 2026 محطة الدعم - جميع الحقوق محفوظة
</footer>

<!-- ===== SCRIPT ===== -->
<script>

function getClient(){
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
  );
}

let currentFilter = "all";

function setFilter(type){
  currentFilter = type;

  document.querySelectorAll(".stat-filter").forEach(el=>{
    el.classList.remove("active");
  });

  event.currentTarget.classList.add("active");

  loadReports();
}

async function loadReports(){
  const supabase = getClient();

  const { data, error } = await supabase
    .from("reports")
    .select("*");

  if(error) return;

  const list = document.getElementById("reportsList");
  list.innerHTML = "";

  let done = 0;
  let review = 0;

  data.forEach(r=>{
    if(r.status === "تم التنفيذ") done++;
    if(r.status === "قيد المراجعة") review++;
  });

  document.getElementById("doneCount").innerText = done;
  document.getElementById("reviewCount").innerText = review;
  document.getElementById("totalCount").innerText = data.length;

  let filtered = data;

  if(currentFilter === "done"){
    filtered = data.filter(r => r.status === "تم التنفيذ");
  }

  if(currentFilter === "review"){
    filtered = data.filter(r => r.status === "قيد المراجعة");
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">لا يوجد بلاغات</div>`;
    return;
  }

  filtered.forEach(r=>{
    list.innerHTML += `
      <div class="report-row">
        <div class="report-text">
          <b>#${r.id}</b> - ${r.description}
        </div>

        <div class="report-actions">
          <button onclick="updateStatus(${r.id}, 'قيد المراجعة')">قيد المراجعة</button>
          <button onclick="updateStatus(${r.id}, 'تم التنفيذ')">تم التنفيذ</button>
        </div>
      </div>
    `;
  });
}

async function updateStatus(id, status){
  const supabase = getClient();

  await supabase
    .from("reports")
    .update({ status: status })
    .eq("id", id);

  loadReports();
}

loadReports();

</script>

</body>
</html>
