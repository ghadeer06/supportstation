<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المسؤول</title>
  <link rel="stylesheet" href="adminStyles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <a href="login.html" class="logout">تسجيل الخروج</a>

    <div class="admin-left">
      <div class="admin-title">
        <h1>لوحة تحكم المسؤول</h1>
        <span>متابعة البلاغات</span>
      </div>
      <img src="img/logo.png" class="admin-logo" alt="الشعار">
    </div>
  </header>

  <main class="admin-main">

    <section class="admin-cards">
      <button type="button" class="stat-card stat-filter active" id="filterAll">
        <h3>إجمالي البلاغات</h3>
        <p id="totalCount">0</p>
      </button>

      <button type="button" class="stat-card stat-filter" id="filterReview">
        <h3>قيد المراجعة</h3>
        <p id="reviewCount">0</p>
      </button>

      <button type="button" class="stat-card stat-filter" id="filterDone">
        <h3>تم التنفيذ</h3>
        <p id="doneCount">0</p>
      </button>
    </section>

    <section class="reports-section">
      <h2 class="section-title">بلاغات المدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="trainerReports"></div>
      </div>
    </section>

    <section class="reports-section">
      <h2 class="section-title">بلاغات المتدربين</h2>
      <div class="reports-box">
        <div class="reports-scroll" id="traineeReports"></div>
      </div>
    </section>

  </main>

<script>
function getClient() {
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE'
  );
}

let currentFilter = "all";

function normalizeStatus(status) {
  if (status === "تم الحل") return "تم التنفيذ";
  if (status === "قيد المعالجة") return "قيد المراجعة";
  return status || "قيد المراجعة";
}

function mapStatusToFilter(status) {
  const s = normalizeStatus(status);
  if (s === "تم التنفيذ") return "done";
  return "review";
}

function setFilter(filter, clickedCard) {
  currentFilter = filter;

  document.querySelectorAll(".stat-filter").forEach(card => {
    card.classList.remove("active");
  });

  clickedCard.classList.add("active");
  loadReports();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("filterAll").addEventListener("click", function () {
    setFilter("all", this);
  });

  document.getElementById("filterReview").addEventListener("click", function () {
    setFilter("review", this);
  });

  document.getElementById("filterDone").addEventListener("click", function () {
    setFilter("done", this);
  });

  loadReports();
});

function openReport(id) {
  localStorage.setItem("adminSelectedReport", id);
  window.location.href = "admin_report.html";
}

function makeReportRow(r) {
  const statusText = normalizeStatus(r.status);
  const statusFilter = mapStatusToFilter(r.status);

  if (currentFilter !== "all" && currentFilter !== statusFilter) {
    return "";
  }

  return `
    <div class="legacy-report-row">
      <div class="legacy-report-content">
        <span class="legacy-id">#${r.id}</span>
        <span class="legacy-type">${r.type || "-"}</span>
        <span><strong>الوصف:</strong> ${r.description || "-"}</span>
        <span><strong>الموقع:</strong> ${r.location || "-"}</span>
        <span><strong>الحالة:</strong> ${statusText}</span>
      </div>

      <div class="legacy-report-btns">
        <button type="button" class="legacy-view-btn" onclick="openReport(${r.id})">عرض بلاغ</button>
      </div>
    </div>
  `;
}

async function loadReports() {
  const supabase = getClient();

  const { data, error } = await supabase
    .from("reports")
    .select("*")
    .order("id", { ascending: false });

  const trainerBox = document.getElementById("trainerReports");
  const traineeBox = document.getElementById("traineeReports");

  if (error) {
    trainerBox.innerHTML = `<div class="empty-row">حدث خطأ في تحميل البلاغات</div>`;
    traineeBox.innerHTML = `<div class="empty-row">حدث خطأ في تحميل البلاغات</div>`;
    return;
  }

  const reports = data || [];

  const trainerData = reports.filter(r => r.sender_role === "trainer");
  const traineeData = reports.filter(r => r.sender_role === "trainee");

  const normalizedReports = reports.map(r => ({
    ...r,
    status: normalizeStatus(r.status)
  }));

  const totalCount = normalizedReports.length;
  const reviewCount = normalizedReports.filter(r => r.status === "قيد المراجعة").length;
  const doneCount = normalizedReports.filter(r => r.status === "تم التنفيذ").length;

  document.getElementById("totalCount").innerText = totalCount;
  document.getElementById("reviewCount").innerText = reviewCount;
  document.getElementById("doneCount").innerText = doneCount;

  const trainerHtml = trainerData.map(makeReportRow).join("");
  const traineeHtml = traineeData.map(makeReportRow).join("");

  trainerBox.innerHTML = trainerHtml || `<div class="empty-row">لا توجد بلاغات</div>`;
  traineeBox.innerHTML = traineeHtml || `<div class="empty-row">لا توجد بلاغات</div>`;
}
</script>

</body>
</html>
