<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ===== ROOT ===== */
:root{
  --dark:#0F2F4A;
  --mid:#5E7B93;
  --bg:#F3F1EC;
  --footer:#2c3e50;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Tajawal",sans-serif;
  background:var(--bg);
  padding-top:80px;
}

/* ===== HEADER ===== */
.admin-header{
  position:fixed;
  top:0;
  right:0;
  left:0;
  height:80px;
  background:linear-gradient(to left,var(--dark),var(--mid));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  z-index:1000;
}

.menu-btn{
  display:none;
  background:#fff;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  font-size:20px;
}

.logout{
  background:#fff;
  color:var(--dark);
  padding:6px 12px;
  border-radius:10px;
  text-decoration:none;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:250px;
  position:fixed;
  right:0;
  top:80px;
  height:calc(100vh - 80px);
  background:linear-gradient(to bottom,var(--dark),var(--mid));
  padding:20px;
  transition:.3s;
}

.sidebar-menu{
  list-style:none;
  margin-top:20px;
}

.sidebar-menu li{
  margin-bottom:10px;
}

.sidebar-menu a{
  color:#fff;
  text-decoration:none;
  display:block;
  padding:10px;
  border-radius:10px;
}

.sidebar-menu li.active a{
  background:#1e4f73;
}

/* ===== MAIN ===== */
.admin-main{
  margin-right:250px;
  padding:20px;
}

/* ===== BOXES ===== */
.reports-box{
  background:#fff;
  padding:15px;
  border-radius:15px;
  max-height:300px;
  overflow-y:auto;
}

/* ===== CARD ===== */
.report-card{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  border-right:4px solid var(--mid);
}

/* ===== MOBILE ===== */
@media(max-width:992px){

  .menu-btn{
    display:block;
  }

  .sidebar{
    right:-260px;
    top:0;
    height:100vh;
  }

  .sidebar.open{
    right:0;
  }

  .admin-main{
    margin-right:0;
  }

}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
}

.overlay.show{
  display:block;
}

</style>
</head>

<body>

<header class="admin-header">
  <button id="menuToggle" class="menu-btn">☰</button>
  <h2>الصفحة الرئيسية</h2>
  <a href="index.html" class="logout">تسجيل الخروج</a>
</header>

<div id="overlay" class="overlay"></div>

<div class="dashboard-layout">

<aside class="sidebar" id="sidebar">
  <ul class="sidebar-menu">
    <li class="active"><a href="admin.html">الرئيسية</a></li>
    <li><a href="reports.html">البلاغات</a></li>
    <li><a href="tasks.html">مهام السلامة</a></li>
    <li><a href="events.html">الفعاليات</a></li>
  </ul>
</aside>

<main class="admin-main">

<h3>أحدث الإشعارات</h3>
<div id="latestNotifications" class="reports-box"></div>

<br>

<h3>أحدث المهام</h3>
<div id="latestTasks" class="reports-box"></div>

</main>
</div>

<script>

/* ===== SIDEBAR ===== */
const menuBtn = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

menuBtn.onclick = ()=>{
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
};

overlay.onclick = ()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
};

/* ===== SUPABASE ===== */
const supabase = window.supabase.createClient(
"https://mcxdjisoyqdnyieboqpy.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeGRqaXNveXFkbnlpZWJvcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI3NDAsImV4cCI6MjA5MDk3ODc0MH0.kIwJ1pc-GLX1lTvstLSDZ5Li1rd9vwutI4-Wz_HR6nE"
);

/* ===== LOAD EVENTS ===== */
async function loadEvents(){
  const box = document.getElementById("latestNotifications");

  const {data} = await supabase.from("events").select("*").limit(5);

  box.innerHTML="";
  data.forEach(e=>{
    box.innerHTML += `
      <div class="report-card">
        <h4>${e.title}</h4>
        <p>${e.description}</p>
      </div>
    `;
  });
}

/* ===== LOAD TASKS ===== */
async function loadTasks(){
  const box = document.getElementById("latestTasks");

  const {data} = await supabase.from("tasks").select("*").limit(5);

  box.innerHTML="";
  data.forEach(t=>{
    box.innerHTML += `
      <div class="report-card">
        <h4>${t.title}</h4>
        <p>${t.type}</p>
      </div>
    `;
  });
}

loadEvents();
loadTasks();

</script>

</body>
</html>
