<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة المسؤول</title>
  <link rel="stylesheet" href="adminStyles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="admin-left">
    <div class="admin-title">
      <h1>لوحة المسؤول</h1>
      <span>إدارة البلاغات</span>
    </div>
    <img src="img/logo.png" class="admin-logo" alt="">
  </div>
  <a href="login.html" class="logout">تسجيل الخروج</a>
</header>

<main class="admin-main">
  <section class="reports-section">
    <h2 class="section-title">جميع البلاغات</h2>

    <div class="reports-box">
      <div class="reports-scroll" id="reportsList"></div>
    </div>
  </section>
</main>

<script>
function getClient(){
  return window.supabase.createClient(
    'https://mcxdjisoyqdnyieboqpy.supabase.co',
    'حطي_هنا_anon_key'
  );
}

async function updateStatus(id, status){
  const supabase = getClient();

  const { error } = await supabase
    .from("reports")
    .update({ status: status })
    .eq("id", id);

  if(error){
    alert("خطأ في تحديث الحالة");
    return;
  }

  loadReports();
}

async function loadReports(){
  const container = document.getElementById("reportsList");
  container.innerHTML = "جاري التحميل...";

  const supabase = getClient();

  const { data, error } = await supabase
    .from("reports")
    .select("*")
    .order("id", { ascending: false });

  if(error){
    container.innerHTML = "خطأ في تحميل البيانات";
    return;
  }

  if(!data || data.length === 0){
    container.innerHTML = "لا يوجد بلاغات";
    return;
  }

  container.innerHTML = "";

  data.forEach(r => {
    container.innerHTML += `
      <div class="report-card">
        <div class="right-tags">
          <span class="tag id">#${r.id}</span>
          <span class="tag type">${r.type || "-"}</span>
        </div>

        <div class="report-body">
          <div class="report-meta">
            <strong>الموقع:</strong> ${r.location || "-"}
            <span class="dot">•</span>
            <strong>الحالة:</strong> ${r.status || "-"}
          </div>

          <div class="badges">
            <span class="badge sev">شدة البلاغ: ${r.rate || "-"}</span>
            <span class="badge priority">الدور: ${r.sender_role || "-"}</span>
          </div>

          <div class="report-text">
            <strong>الوصف:</strong> ${r.description || "-"}<br>
            <strong>مقدم البلاغ:</strong> ${r.sender_name || "-"}<br>
            <strong>الإيميل:</strong> ${r.sender_email || "-"}
          </div>

          <div class="actions">
            <button class="btn-process" onclick="updateStatus(${r.id}, 'قيد المعالجة')">قيد المعالجة</button>
            <button class="btn-done" onclick="updateStatus(${r.id}, 'تم التنفيذ')">تم التنفيذ</button>
          </div>
        </div>
      </div>
    `;
  });
}

loadReports();
</script>

</body>
</html>
